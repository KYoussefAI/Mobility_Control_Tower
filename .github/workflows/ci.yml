name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,quality,analytics,orchestration]'
      - name: Python quality and tests
        run: |
          ruff check .
          black --check .
          isort --check-only .
          mypy src
          coverage run -m pytest
          coverage report --fail-under=80
      - name: dbt parse
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse

  release-proof:
    name: release-proof
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install recovery dependencies
        run: python -m pip install -e '.[dev,quality,analytics,orchestration]'
      - name: Build image and validate Compose
        run: |
          docker build -t mobility-control-tower:ci .
          docker compose --profile demo config
      - name: Validate production overlay
        env:
          MCT_PUBLIC_HOSTNAME: mct.example.test
          MCT_AUTH_SECRET: ci-placeholder-secret
          TLS_EMAIL: ci@example.test
        run: |
          docker compose -f docker-compose.yml -f deploy/production.compose.yml --profile production config --format json > production-compose.json
          python scripts/verify_production_overlay.py --compose-json production-compose.json
      - name: Validate Prometheus rules
        run: |
          python scripts/validate_grafana_metrics.py
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observability/prometheus:/etc/prometheus:ro" prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observability/prometheus:/etc/prometheus:ro" -w /etc/prometheus/tests prom/prometheus:v2.54.1 test rules mct_alerts.test.yml
      - name: Verify local backup and restore
        run: python scripts/verify_restore.py
