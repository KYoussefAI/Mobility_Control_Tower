x-mct-common: &mct-common
  build: .
  environment: &mct-environment
    MCT_DATA_ROOT: ${MCT_DATA_ROOT:-/opt/mct/data}
    MCT_DBT_DATABASE_PATH: ${MCT_DBT_DATABASE_PATH:-/opt/mct/data/mart/mobility_control_tower.duckdb}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/mct/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__WEBSERVER__SECRET_KEY: local-development-only
  volumes:
    - ./data:/opt/mct/data
    - airflow-state:/opt/airflow

services:
  airflow-init:
    <<: *mct-common
    command: >
      bash -c "airflow db migrate &&
      if ! airflow users list --output plain | grep -q 'airflow'; then
      airflow users create --username airflow --password airflow
      --firstname Local --lastname User --role Admin --email local@example.test;
      fi"

  airflow-webserver:
    <<: *mct-common
    command: airflow webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *mct-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    <<: *mct-common
    command: streamlit run dashboard/app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"

volumes:
  airflow-state:
