[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-control-tower"
version = "0.1.0"
description = "Public transport data engineering pipeline for GTFS and GTFS-Realtime analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "altair>=6,<7",
  "duckdb>=1.1,<2",
  "gtfs-realtime-bindings>=1.0,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
analytics = ["dbt-core>=1.11,<1.12", "dbt-duckdb>=1.11,<1.12"]
orchestration = ["apache-airflow>=2.10,<3"]
dev = [
  "black>=24.10,<26",
  "coverage[toml]>=7.6,<8",
  "isort>=5.13,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-PyYAML>=6",
  "types-requests>=2",
]
quality = [
  "black>=24.10,<26",
  "coverage[toml]>=7.6,<8",
  "isort>=5.13,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-PyYAML>=6",
  "types-requests>=2",
]

[project.scripts]
mct = "mobility_control_tower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["data", "dbt/target", "airflow/logs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
packages = ["mobility_control_tower"]

[tool.coverage.run]
branch = true
source = ["mobility_control_tower"]

[tool.coverage.report]
show_missing = true
skip_empty = true
