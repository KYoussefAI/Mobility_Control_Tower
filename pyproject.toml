[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-control-tower"
version = "0.1.0"
description = "Local public transport data engineering platform"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
  "duckdb>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2",
  "gtfs-realtime-bindings>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "coverage[toml]>=7,<8", "httpx2>=2,<3"]
quality = ["ruff>=0.6,<1", "black>=24,<25", "isort>=5,<6", "mypy>=1,<2", "types-PyYAML", "types-requests"]
analytics = ["dbt-core>=1.10,<2", "dbt-duckdb>=1.10,<2"]

[project.scripts]
mobility-control-tower = "mobility_control_tower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 160
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 160

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["data", "dbt/target", "quality_contracts/validation_results", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
