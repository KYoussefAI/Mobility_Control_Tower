[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-control-tower"
version = "0.1.0"
description = "Local public transport data engineering platform"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "coverage[toml]>=7,<8"]
quality = ["ruff>=0.6,<1", "black>=24,<25", "isort>=5,<6", "mypy>=1,<2", "types-PyYAML", "types-requests"]

[project.scripts]
mobility-control-tower = "mobility_control_tower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
