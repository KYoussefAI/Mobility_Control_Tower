version: 2

models:
  - name: fct_realtime_delay_observations
    description: Usable arrival/departure delay evidence; null delay is not treated as zero.
    columns:
      - {name: delay_observation_key, tests: [not_null, unique]}
      - {name: source, tests: [not_null]}
      - {name: delay_source, tests: [not_null]}
  - name: realtime_trip_coverage
    description: Matched observations divided by eligible scheduled trips; absence remains unknown service state.
    columns:
      - {name: source, tests: [not_null]}
      - {name: coverage_status, tests: [not_null]}
      - {name: confidence_status, tests: [not_null]}
  - name: route_delay_distribution
    description: Route delay distribution with sample and coverage context.
  - name: stop_delay_distribution
    description: Stop delay distribution with sample and coverage context.
  - name: network_delay_distribution
    description: Network delay distribution with sample and coverage context.
  - name: route_on_time_performance
    description: Route OTP under configurable project thresholds, not a universal transit standard.
  - name: network_on_time_performance
    description: Network OTP under configurable project thresholds, not passenger-experience proof.
