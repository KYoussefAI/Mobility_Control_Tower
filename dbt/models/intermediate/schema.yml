version: 2

models:
  - name: int_service_dates
    description: GTFS regular service dates after applying added and removed exceptions.
    columns:
      - name: service_id
        tests: [not_null]
      - name: service_date
        tests: [not_null]
  - name: int_scheduled_trips
    columns:
      - name: trip_id
        tests: [not_null]
      - name: service_date
        tests: [not_null]
  - name: int_delay_observations
    description: One row per source snapshot/entity/stop key. Exact analytical duplicates collapse; conflicting payloads are marked AMBIGUOUS and never enter KPI models.
    columns:
      - name: snapshot_id
        tests: [not_null]
      - name: delay_quality_status
        tests:
          - accepted_values:
              arguments:
                values: [VALID, MISSING, OUT_OF_RANGE, AMBIGUOUS_SOURCE]
  - name: int_trip_stop_observations
    description: One canonical KPI-eligible row per scheduled service-date, trip, and stop sequence, representing the latest valid published GTFS-Realtime delay.
    columns:
      - name: service_date
        tests: [not_null]
      - name: trip_id
        tests: [not_null]
      - name: stop_sequence
        tests: [not_null]
      - name: delay_seconds
        tests: [not_null]
      - name: snapshot_id
        tests: [not_null]
