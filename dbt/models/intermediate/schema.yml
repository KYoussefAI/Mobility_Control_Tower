version: 2

models:
  - name: int_service_dates
    description: GTFS regular service dates after applying added and removed exceptions.
    columns:
      - name: service_id
        tests: [not_null]
      - name: service_date
        tests: [not_null]
  - name: int_scheduled_trips
    columns:
      - name: trip_id
        tests: [not_null]
      - name: service_date
        tests: [not_null]
  - name: int_delay_observations
    description: Exact analytical Trip Update duplicates are collapsed and ambiguous keys are excluded before static schedule enrichment. Published delays beyond ±7200 seconds are retained as OUT_OF_RANGE but are not KPI-eligible.
    columns:
      - name: snapshot_id
        tests: [not_null]
      - name: delay_quality_status
        tests:
          - accepted_values:
              arguments:
                values: [VALID, MISSING, OUT_OF_RANGE]
