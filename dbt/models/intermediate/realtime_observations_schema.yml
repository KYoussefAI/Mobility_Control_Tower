version: 2

models:
  - name: int_realtime_eligible_scheduled_trips
    description: Scheduled trips eligible for matching at source, service date, route, and trip grain.
    columns:
      - {name: source, tests: [not_null]}
      - {name: service_date, tests: [not_null]}
      - {name: route_id, tests: [not_null]}
      - {name: trip_id, tests: [not_null]}
      - {name: eligibility_status, tests: [not_null]}
  - name: int_realtime_trip_observations
    description: Deduplicated realtime trip observations with explicit match and cancellation evidence fields.
    columns:
      - {name: observation_key, tests: [not_null, unique]}
      - {name: source, tests: [not_null]}
      - {name: match_status, tests: [not_null]}
      - {name: is_explicitly_canceled, tests: [not_null]}
