version: 2

models:
  - name: stg_routes
    description: One row per Tisséo route from the selected static feed.
    columns:
      - name: route_id
        tests: [not_null, unique]
  - name: stg_trips
    description: Scheduled trips with route and service identifiers.
    columns:
      - name: trip_id
        tests: [not_null, unique]
      - name: route_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_routes')
                field: route_id
      - name: service_id
        tests: [not_null]
  - name: stg_stops
    description: One row per physical or logical stop in the selected static feed.
    columns:
      - name: stop_id
        tests: [not_null, unique]
  - name: stg_stop_times
    description: Scheduled stop calls with GTFS times represented as seconds after service-day midnight.
    columns:
      - name: trip_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_trips')
                field: trip_id
      - name: stop_sequence
        tests: [not_null]
      - name: stop_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stops')
                field: stop_id
  - name: stg_calendar_dates
    columns:
      - name: exception_type
        tests:
          - accepted_values:
              arguments:
                values: [1, 2]
  - name: stg_realtime_updates
    description: Stop-time updates from scheduled polling; rows without a delay remain unknown.
    columns:
      - name: snapshot_id
        tests: [not_null]
  - name: stg_feed_snapshots
    columns:
      - name: snapshot_id
        tests: [not_null, unique]

