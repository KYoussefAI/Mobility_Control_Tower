name: mobility_control_tower
version: "0.1.0"
config-version: 2
profile: mobility_control_tower

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  static_path: ../data/silver/static/fixture
  realtime_path: ../data/silver/realtime
  on_time_early_seconds: -60
  on_time_late_seconds: 300
  max_abs_delay_seconds: 7200
  min_sufficient_sample_size: 30
  fresh_realtime_seconds: 90
  stale_realtime_seconds: 300

models:
  mobility_control_tower:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
